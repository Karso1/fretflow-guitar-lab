<header class="site-header"><a class="wordmark" href="#home" aria-label="FretFlow 首页">fret<span>flow</span><i></i></a><nav class="primary-nav" aria-label="主导航"><a href="#library" data-nav="library">曲库</a><a href="lab.html#fretboard"><span class="wide-label">指板实验室</span><span class="short-label">指板</span></a><a href="#saved" data-nav="saved"><span class="wide-label">我的收藏</span><span class="short-label">收藏</span></a></nav><button class="search-trigger icon-label" id="openSearch" aria-label="搜索歌曲"><i class="icon" data-icon="search"></i><span>找首歌</span><kbd>⌘ K</kbd></button></header>
<main id="main" tabindex="-1"></main>
<footer class="site-footer"><a class="wordmark" href="#home">fret<span>flow</span><i></i></a><p>听懂一首，弹好一首。<br><small>原创教学谱图已存档。音乐与完整编配见各曲目来源。</small></p><a href="lab.html#practice">去练一会儿<i class="icon" data-icon="arrow-up-right"></i></a></footer>
<div class="practice-dock" id="practiceDock" hidden><div class="dock-song"><span class="dock-indicator" id="dockIndicator"></span><div><strong id="dockTitle"></strong><small id="dockSubtitle">原创和弦连接练习 · 示意音色</small></div></div><button class="round-button dock-play" id="dockPlay" aria-label="播放和弦练习"><i class="icon" data-icon="play"></i></button><div class="dock-current"><strong id="dockChord">C</strong><small id="dockStep">1 / 4</small></div><label class="tempo-control"><span>练习速度</span><input id="tempo" type="range" min="40" max="120" value="60" aria-label="练习速度 BPM"><output id="tempoValue">60 BPM</output></label><canvas id="audioScope" width="170" height="44" aria-hidden="true"></canvas><button class="icon-button" id="closeDock" aria-label="关闭和弦练习"><i class="icon" data-icon="x"></i></button></div>
<dialog id="searchDialog" class="search-dialog" aria-labelledby="searchTitle"><div class="search-dialog-head"><h2 class="sr-only" id="searchTitle">搜索曲库</h2><i class="icon" data-icon="search"></i><input id="commandInput" placeholder="歌名、歌手，或想练的和弦…" autocomplete="off" aria-label="搜索曲库"><button class="icon-button" data-close="searchDialog" aria-label="关闭搜索"><i class="icon" data-icon="x"></i></button></div><div id="commandResults" class="command-results"></div><p class="search-hint">用上下键选择，Enter 打开，Esc 关闭。</p></dialog>
<dialog id="sheetDialog" class="sheet-dialog" aria-labelledby="sheetDialogTitle"><div class="sheet-dialog-toolbar"><div><strong id="sheetDialogTitle">谱面</strong><small>缩放后可左右、上下移动查看</small></div><div class="sheet-tools"><button class="icon-button" id="zoomOut" aria-label="缩小"><i class="icon" data-icon="minus"></i></button><output id="zoomValue">100%</output><button class="icon-button" id="zoomIn" aria-label="放大"><i class="icon" data-icon="plus"></i></button><button class="icon-button" id="resetZoom" aria-label="适合窗口"><i class="icon" data-icon="maximize-2"></i></button><a class="icon-button" id="sheetDownload" download aria-label="下载谱面"><i class="icon" data-icon="download"></i></a><button class="icon-button" data-close="sheetDialog" aria-label="关闭谱面"><i class="icon" data-icon="x"></i></button></div></div><div class="sheet-viewport" id="sheetViewport"><img id="sheetImage" alt=""></div></dialog>
<div id="toast" class="toast" role="status"></div><noscript><p class="no-js">请开启 JavaScript 使用交互曲库。<a href="content/songs.json">查看曲库资料</a></p></noscript>
</body></html>
